<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Glowing Outer Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" />

  <!-- Shoulders / Hoodie -->
  <path d="M40 185 Q100 155 160 185 L160 195 L40 195 Z" fill="#1e1b4b" opacity="0.9" />
  <path d="M75 162 L100 182 L125 162" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="88" y="130" width="24" height="25" rx="6" fill="#f59e0b" />

  <!-- Face -->
  <rect x="68" y="65" width="64" height="72" rx="28" fill="#fbbf24" />

  <!-- Cool Young Guy Hair -->
  <path d="M64 80 Q64 45 100 45 Q136 45 136 80 Q130 65 115 62 Q95 62 82 70 Q70 78 64 80 Z" fill="url(#hairGrad)" />
  <!-- Sideburns -->
  <path d="M67 78 L67 95 L72 90 Z" fill="url(#hairGrad)" />
  <path d="M133 78 L133 95 L128 90 Z" fill="url(#hairGrad)" />

  <!-- Confident & Friendly Eyes -->
  <ellipse cx="84" cy="94" rx="4.5" ry="5.5" fill="#1e1b4b" />
  <circle cx="85.5" cy="92.5" r="1.5" fill="#ffffff" />
  <ellipse cx="116" cy="94" rx="4.5" ry="5.5" fill="#1e1b4b" />
  <circle cx="117.5" cy="92.5" r="1.5" fill="#ffffff" />

  <!-- Youthful Eyebrows -->
  <path d="M76 83 Q85 80 93 84" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
  <path d="M107 84 Q115 80 124 83" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />

  <!-- Warm Grin / Smile -->
  <path d="M86 115 Q100 128 114 115" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M89 116 Q100 125 111 116" fill="#ffffff" opacity="0.9" />

  <!-- Modern Headphones (giving young energetic companion vibe) -->
  <path d="M56 88 A44 44 0 0 1 144 88" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Ear cups -->
  <rect x="52" y="82" width="12" height="26" rx="6" fill="#f43f5e" />
  <rect x="136" y="82" width="12" height="26" rx="6" fill="#f43f5e" />
</svg>
