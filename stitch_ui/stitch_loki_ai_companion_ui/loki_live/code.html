<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-high/60 backdrop-blur-2xl shadow-sm">
<span class="relative flex h-2.5 w-2.5">

<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary"></span>
</span>
<span class="font-label-md text-label-md text-on-surface font-semibold tracking-wide">لوكي سامعك لايف</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>

</div>
<button aria-label="التبديل إلى الدردشة النصية" class="w-11 h-11 rounded-full bg-surface-container-high/70 backdrop-blur-xl flex items-center justify-center text-on-surface shadow-md active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
</button>
</div>
<div class="flex flex-col items-center justify-center px-space-md mt-4 relative z-10">
<div class="relative w-72 h-72 flex items-center justify-center my-2 cursor-pointer group" id="voice-avatar-orb" title="المس للمقاطعة">
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary-container via-secondary-container to-tertiary-container opacity-25 blur-3xl animate-pulse"></div>
<div class="absolute w-64 h-64 rounded-full bg-gradient-to-br from-primary via-secondary to-tertiary opacity-30 animate-spin" style="animation-duration: 14s; filter: blur(36px);"></div>
<div class="relative w-48 h-48 flex items-center justify-center">
<svg class="w-full h-full drop-shadow-[0_0_35px_rgba(56,189,248,0.45)]" viewBox="0 0 200 200">
<defs>
<linearGradient id="orbGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#38bdf8"></stop>
<stop offset="50%" stop-color="#a855f7"></stop>
<stop offset="100%" stop-color="#ec4899"></stop>
</linearGradient>
<filter height="140%" id="glowFilter" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="8"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
</filter>
</defs>
<path d="M100 20 C120 70 130 80 180 100 C130 120 120 130 100 180 C80 130 70 120 20 100 C70 80 80 70 100 20 Z" fill="url(#orbGradient)" filter="url(#glowFilter)" id="livingShape" opacity="0.95">
<animateTransform attributeName="transform" dur="20s" from="0 100 100" repeatCount="indefinite" to="360 100 100" type="rotate"></animateTransform>
</path>
<circle class="animate-pulse" cx="100" cy="100" fill="#ffffff" r="14"></circle>
<circle class="animate-ping" cx="145" cy="55" fill="#38bdf8" r="7" style="animation-duration: 3s;"></circle>
<circle cx="55" cy="148" fill="#ec4899" opacity="0.85" r="6"></circle>
</svg>
</div>
<div class="absolute inset-0 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-surface-dim/40 backdrop-blur-sm">
<span class="font-label-md text-label-md text-on-surface bg-surface-container-highest px-3 py-1.5 rounded-full shadow-lg">اضغط للمقاطعة</span>
</div>
</div>
<div class="flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-surface-container-high/70 backdrop-blur-md shadow-sm mb-3">
<div class="flex items-end gap-1 h-3.5" id="speech-bars">
<span class="w-1 bg-primary rounded-full animate-bounce h-2" style="animation-delay: 0.1s"></span>
<span class="w-1 bg-primary-fixed-dim rounded-full animate-bounce h-3.5" style="animation-delay: 0.25s"></span>
<span class="w-1 bg-secondary rounded-full animate-bounce h-1.5" style="animation-delay: 0.4s"></span>
<span class="w-1 bg-primary-container rounded-full animate-bounce h-3" style="animation-delay: 0.15s"></span>
</div>
<span class="font-label-sm text-label-sm text-primary font-medium tracking-wide">لوكي يتحدث الآن</span>
</div>
<div class="flex items-center gap-1.5 text-on-surface-variant/90 mb-5">
<span class="material-symbols-outlined text-[16px] text-primary">lightbulb</span>
<span class="font-body-sm text-body-sm">اتكلم في أي وقت أو المس الشاشة للمقاطعة الفورية</span>
</div>
</div>
<div class="px-space-md relative z-10 w-full max-w-md mx-auto mb-6">
<div class="bg-surface-container-high/40 backdrop-blur-2xl p-4 rounded-2xl shadow-xl flex flex-col gap-3">
<div class="flex items-start gap-2.5">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant mt-0.5">account_circle</span>
<div class="flex-1">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-0.5">أنت</span>
<p class="font-body-md text-body-md text-on-surface/90 leading-relaxed font-light">
            «حاسس بتوهان كبير ومش عارف أبدأ منين...»
          </p>
</div>
</div>
<div class="h-[1px] w-full bg-surface-variant/60"></div>
<div class="flex items-start gap-2.5">
<span class="material-symbols-outlined text-[18px] text-primary mt-0.5">auto_awesome</span>
<div class="flex-1">
<span class="font-label-sm text-label-sm text-primary block mb-0.5 font-semibold">لوكي</span>
<p class="font-body-md text-body-md text-on-surface leading-relaxed" id="typewriter-text">
            «أنا سامعك وفاهمك.. خلينا نبدأ بأبسط حاجة، سيب الحمل ده معايا ثواني ونرتب أولوياتك سوا.»
          </p>
</div>
</div>
</div>
</div>
<div class="w-full flex items-center justify-center gap-1 px-4 mb-5 opacity-70">
<span class="h-1 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-primary-container/60 w-3/4 rounded-full animate-pulse"></span>
</span>
<span class="h-2 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-primary/70 w-4/5 rounded-full animate-pulse" style="animation-delay: 0.1s"></span>
</span>
<span class="h-4 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-secondary w-full rounded-full animate-pulse" style="animation-delay: 0.3s"></span>
</span>
<span class="h-3 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-tertiary-container w-2/3 rounded-full animate-pulse" style="animation-delay: 0.2s"></span>
</span>
<span class="h-5 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-primary w-5/6 rounded-full animate-pulse" style="animation-delay: 0.15s"></span>
</span>
<span class="h-2 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-primary-container/80 w-1/2 rounded-full animate-pulse" style="animation-delay: 0.35s"></span>
</span>
<span class="h-1 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
<span class="block h-full bg-surface-variant w-1/3 rounded-full"></span>
</span>
</div>
<div class="w-full px-space-md mb-6 relative z-20">
<div class="flex items-center justify-evenly max-w-sm mx-auto bg-surface-container-high/50 backdrop-blur-3xl py-3 px-6 rounded-full shadow-2xl">
<button aria-label="كتم الميكروفون" class="w-13 h-13 p-3.5 rounded-full bg-surface-container-highest/80 text-on-surface flex items-center justify-center active:scale-90 transition-transform" id="mute-toggle-btn" type="button">
<span class="material-symbols-outlined text-[24px]" id="mic-icon">mic</span>
</button>
<button aria-label="إنهاء المحادثة" class="w-16 h-16 rounded-full bg-error text-on-error flex items-center justify-center shadow-[0_0_24px_rgba(255,180,171,0.35)] active:scale-95 transition-transform hover:brightness-110" type="button">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
<button aria-label="تبديل مخرج الصوت" class="w-13 h-13 p-3.5 rounded-full bg-surface-container-highest/80 text-on-surface flex items-center justify-center active:scale-90 transition-transform" id="speaker-toggle-btn" type="button">
<span class="material-symbols-outlined text-[24px]" id="speaker-icon">volume_up</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const micBtn = document.getElementById('mute-toggle-btn');
    const micIcon = document.getElementById('mic-icon');
    let isMuted = false;

    if (micBtn && micIcon) {
      micBtn.addEventListener('click', function() {
        isMuted = !isMuted;
        if (isMuted) {
          micIcon.textContent = 'mic_off';
          micBtn.classList.remove('text-on-surface');
          micBtn.classList.add('text-error', 'bg-error-container/40');
        } else {
          micIcon.textContent = 'mic';
          micBtn.classList.add('text-on-surface');
          micBtn.classList.remove('text-error', 'bg-error-container/40');
        }
      });
    }

    const speakerBtn = document.getElementById('speaker-toggle-btn');
    const speakerIcon = document.getElementById('speaker-icon');
    let isSpeaker = true;

    if (speakerBtn && speakerIcon) {
      speakerBtn.addEventListener('click', function() {
        isSpeaker = !isSpeaker;
        speakerIcon.textContent = isSpeaker ? 'volume_up' : 'hearing';
      });
    }

    const orb = document.getElementById('voice-avatar-orb');
    if (orb) {
      orb.addEventListener('click', function() {
        const text = document.getElementById('typewriter-text');
        if (text) {
          text.style.opacity = '0.5';
          setTimeout(() => {
            text.textContent = '«أنا استمع إليك الآن، تفضل بالتحدث...»';
            text.style.opacity = '1';
          }, 180);
        }
      });
    }
  })();
</script></main></body></html>
